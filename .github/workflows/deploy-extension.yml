# Builds the Amplience importer extension and publishes it to GitHub Pages on every push to main.
# Amplience loads it from https://<owner>.github.io/digital-flyer-generator/
name: Deploy importer extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ts
      - run: npm run extension:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/extension
      - id: deployment
        uses: actions/deploy-pages@v4
